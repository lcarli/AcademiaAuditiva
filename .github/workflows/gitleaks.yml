name: Gitleaks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned open-source Gitleaks CLI
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          grep "  ${archive}$" "gitleaks_${version}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$archive"
      - name: Scan Git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --redact --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif"
      - name: Upload redacted scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          retention-days: 7
