name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  # Manual CD runs still validate before deploying.
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      infra: ${{ steps.scope.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify scope policy
        run: python3 scripts/test_ci_scope.py
      - name: Classify changes
        id: scope
        run: |
          python3 scripts/ci_scope.py classify \
            --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --sha "$GITHUB_SHA" --output artifacts/ci-impact.json
      - name: Publish tested commit and deployment decision
        uses: actions/upload-artifact@v7
        with:
          name: ci-impact
          path: artifacts/ci-impact.json
          retention-days: 7
          if-no-files-found: error

  build-and-test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    env:
      CI_MODE: ${{ needs.changes.outputs.mode }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.*.props', '**/*.csproj', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          target=AcademiaAuditiva.sln
          if [ "$CI_MODE" = "landing" ]; then
            target=Tests/AcademiaAuditiva.IntegrationTests/AcademiaAuditiva.IntegrationTests.csproj
          fi
          echo "CI_TARGET=$target" >> "$GITHUB_ENV"
          dotnet restore "$target"

      - name: Build
        run: dotnet build "$CI_TARGET" --configuration Release --no-restore

      - name: Test full suite
        if: env.CI_MODE == 'full'
        run: dotnet test AcademiaAuditiva.sln --configuration Release --no-build --filter "Category!=AudioDspBudget" --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage"

      - name: Test landing, catalogs and localization
        if: env.CI_MODE == 'landing'
        run: |
          dotnet test "$CI_TARGET" --configuration Release --no-build \
            --filter "FullyQualifiedName~HomePageTests|FullyQualifiedName~ExerciseIndexTests|FullyQualifiedName~LocalizedNamesTests" \
            --logger "trx;LogFileName=test-results.trx"

      - name: Verify audio DSP in production-like Linux container
        if: env.CI_MODE == 'full'
        run: |
          docker run --rm --cpus=0.5 --memory=1g \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --workdir /repo \
            --env DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            sh -c 'apk add --no-cache icu-libs icu-data-full tzdata >/dev/null && dotnet vstest Tests/AcademiaAuditiva.UnitTests/bin/Release/net10.0/AcademiaAuditiva.UnitTests.dll --TestCaseFilter:"FullyQualifiedName~AudioProcessingTests|FullyQualifiedName~ParametricEqTests|FullyQualifiedName~CompressorTests|FullyQualifiedName~AcademiaAuditiva.UnitTests.NewAudioExerciseTests|FullyQualifiedName~ExpandedAudio|FullyQualifiedName~NextAudio|FullyQualifiedName~LoudnessTests|FullyQualifiedName~LoudnessMatchingTests|FullyQualifiedName~AudioMixerServiceTests|FullyQualifiedName~AcademiaAuditiva.UnitTests.GuessFrequencyTests"'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/**/*"

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Aa-ci-only-1433!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Aa-ci-only-1433!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      SQL_PASSWORD: Aa-ci-only-1433!
      AA_EMAIL: admin-e2e@example.test
      E2E_BASE_URL: http://127.0.0.1:5072
      E2E_EXPECT_VERSION: ${{ github.sha }}
      STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
      CI_MODE: ${{ needs.changes.outputs.mode }}
    steps:
      - uses: actions/checkout@v7

      # Not a service container: services can't pass arguments, and the Azure
      # SDK may send a storage API version newer than the latest Azurite knows
      # (Azure.Storage.Blobs 12.30.0 sends 2026-10-06), which Azurite rejects
      # with 400 InvalidHeaderValue. Same flags as scripts/local-audio.ps1.
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose --skipApiVersionCheck
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:10000/; then exit 0; fi
            sleep 1
          done
          docker logs azurite
          exit 1

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.*.props', '**/*.csproj', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Tests/e2e/package-lock.json

      - name: Restore and publish app
        run: |
          dotnet restore AcademiaAuditiva/AcademiaAuditiva.csproj
          dotnet publish AcademiaAuditiva/AcademiaAuditiva.csproj --configuration Release --no-restore --output ./artifacts/app /p:UseAppHost=false

      # The synthetic samples never change, so they're cached and ffmpeg is only
      # installed on a cache miss: when the runner's apt mirror is slow that install
      # alone has taken over 10 minutes. Bump the key if the generation changes.
      - name: Restore synthetic piano samples
        id: piano-samples
        uses: actions/cache@v6
        with:
          path: /tmp/piano-audio
          key: piano-samples-${{ runner.os }}-v1

      - name: Generate synthetic piano samples
        if: steps.piano-samples.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir -p /tmp/piano-audio
          notes=(C Cs D Ds E F Fs G Gs A As B)
          idx=0
          for octave in 1 2 3 4 5 6 7; do
            for note in "${notes[@]}"; do
              freq=$(python3 -c 'import math, sys; idx = int(sys.argv[1]); print(f"{32.70319566257483 * (2 ** (idx / 12)):.4f}")' "$idx")
              ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=${freq}:duration=2.0:sample_rate=44100" -ac 1 "/tmp/piano-audio/${note}${octave}.mp3"
              idx=$((idx + 1))
            done
          done

      - name: Seed Azurite piano samples
        run: |
          set -euo pipefail
          count=$(find /tmp/piano-audio -name '*.mp3' | wc -l)
          if [ "$count" -ne 84 ]; then echo "Expected 84 piano samples, found $count" >&2; exit 1; fi
          az storage container create --name piano-audio --connection-string "$STORAGE_CONNECTION_STRING" --only-show-errors 1>/dev/null
          az storage container create --name piano-audio-mixed --connection-string "$STORAGE_CONNECTION_STRING" --only-show-errors 1>/dev/null
          az storage blob upload-batch --destination piano-audio --source /tmp/piano-audio --pattern '*.mp3' --content-type audio/mpeg --overwrite true --connection-string "$STORAGE_CONNECTION_STRING" --only-show-errors 1>/dev/null

      # The runner image already has Chrome's system libraries; --with-deps would
      # run apt-get again, which is slow whenever the mirror is.
      - name: Install Playwright
        working-directory: Tests/e2e
        run: |
          npm ci
          npx playwright install chromium

      - name: Start app
        working-directory: ./artifacts/app
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5072
          APP_VERSION: ${{ github.sha }}
          ConnectionStrings__DefaultConnection: Server=127.0.0.1,1433;Database=AcademiaAuditivaE2E;User Id=sa;Password=${{ env.SQL_PASSWORD }};Encrypt=True;TrustServerCertificate=True
          Storage__ConnectionString: ${{ env.STORAGE_CONNECTION_STRING }}
          Admin__Email: ${{ env.AA_EMAIL }}
          Admin__InitialPassword: ${{ env.SQL_PASSWORD }}
          ApplicationInsights__ConnectionString: ""
          # Every Playwright sign-in comes from this one address.
          RateLimiting__AccountForms__PermitLimit: "1000"
        run: |
          dotnet AcademiaAuditiva.dll > ../app.log 2>&1 &
          echo $! > ../app.pid
          for i in {1..60}; do
            if curl -fsS "$E2E_BASE_URL/health/ready" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../app.log
          exit 1

      - name: Run Playwright suite
        working-directory: Tests/e2e
        env:
          AA_EMAIL: ${{ env.AA_EMAIL }}
          AA_PASSWORD: ${{ env.SQL_PASSWORD }}
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
          E2E_EXPECT_VERSION: ${{ env.E2E_EXPECT_VERSION }}
        run: |
          if [ "$CI_MODE" = "landing" ]; then
            npm test -- --grep @landing
          else
            npm test
          fi

      - name: Stop app
        if: always()
        run: |
          if [ -f ./artifacts/app.pid ]; then kill "$(cat ./artifacts/app.pid)" || true; fi

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            Tests/e2e/test-results/**
            Tests/e2e/playwright-report/**
            artifacts/app.log

  image-scan:
    name: Image scan (Trivy)
    needs: changes
    if: needs.changes.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image for scan
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t academiaauditiva:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        continue-on-error: true
        with:
          image-ref: academiaauditiva:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  bicep-validate:
    name: Validate Bicep
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep
