name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, "feat/**"]
  # Lets the CD workflow gate deployments on this exact pipeline.
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AcademiaAuditiva.sln

      - name: Build
        run: dotnet build AcademiaAuditiva.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AcademiaAuditiva.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/**/*"

  bicep-validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep
