name: CodeQL

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "30 4 * * 2"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select analysis scope
        id: scope
        run: |
          python3 scripts/ci_scope.py classify \
            --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/codeql-impact.json"

      - name: Setup .NET (global.json)
        if: steps.scope.outputs.mode != 'docs' && matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        if: steps.scope.outputs.mode != 'docs' && matrix.language == 'csharp'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.*.props', '**/*.csproj', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Initialize CodeQL
        if: steps.scope.outputs.mode != 'docs'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Build (.NET)
        if: steps.scope.outputs.mode != 'docs' && matrix.language == 'csharp'
        run: dotnet build AcademiaAuditiva.sln --configuration Release

      - name: Analyze
        if: steps.scope.outputs.mode != 'docs'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
